<line x1="56.0" y1="192.7" x2="630.0" y2="192.7" class="grid" stroke-width="1"/>
<text x="48.0" y="196.7" class="lb ink2" text-anchor="end">3</text>
<line x1="56.0" y1="130.9" x2="630.0" y2="130.9" class="grid" stroke-width="1"/>
<text x="48.0" y="134.9" class="lb ink2" text-anchor="end">4</text>
<text x="56.0" y="398.0" class="lb ink2" text-anchor="middle">0</text>
