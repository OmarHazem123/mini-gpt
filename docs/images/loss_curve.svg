<text x="46.0" y="82.0" class="lb ink2" text-anchor="start">Train</text>
<line x1="102.0" y1="78.0" x2="118.0" y2="78.0" class="s2" stroke-width="2" stroke-linecap="round"/>
<text x="124.0" y="82.0" class="lb ink2" text-anchor="start">Validation</text>
<line x1="56.0" y1="378.0" x2="630.0" y2="378.0" class="axis" stroke-width="1"/>
<text x="48.0" y="382.0" class="lb ink2" text-anchor="end">0</text>
<line x1="56.0" y1="316.2" x2="630.0" y2="316.2" class="grid" stroke-width="1"/>
