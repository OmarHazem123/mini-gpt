<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Training and validation loss</title>
<desc id="desc">Line chart. Train and validation loss fall from about 4.3 at step 0. Validation loss is lowest, 1.471, at step 1750, then rises to 1.729 at step 5000 while train loss falls to 0.585.</desc>
<style>text{font-family:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}.t{font-size:16px;font-weight:600}.st{font-size:13px}.lb{font-size:12px}.pt{font-size:13px;font-weight:600}.bg{fill:#ffffff;stroke:rgba(11,11,11,0.10)}.ink{fill:#191919}.ink2{fill:#666666}.grid{stroke:#e7e7e7}.axis{stroke:#c2c2c2}.s1{stroke:#257de0}.s2{stroke:#f47230}.f1{fill:#257de0}.f2{fill:#f47230}.ring{stroke:#ffffff}@media (prefers-color-scheme: dark){.bg{fill:#191919;stroke:rgba(255,255,255,0.10)}.ink{fill:#efefef}.ink2{fill:#9c9c9c}.grid{stroke:#303030}.axis{stroke:#474747}.s1{stroke:#338ced}.s2{stroke:#e76624}.f1{fill:#338ced}.f2{fill:#e76624}.ring{stroke:#191919}}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="429" rx="8"/>
