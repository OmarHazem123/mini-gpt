<text x="256.9" y="257.1" class="lb ink" text-anchor="middle">Best validation 1.471</text>
<text x="256.9" y="272.1" class="lb ink2" text-anchor="middle">at step 1,750 (best.pt)</text>
<text x="640.0" y="275.2" class="lb ink" text-anchor="start">Validation 1.729</text>
<text x="640.0" y="345.8" class="lb ink" text-anchor="start">Train 0.585</text>
<text x="417.6" y="186.5" class="lb ink2" text-anchor="start">After step 1,750 the model overfits:</text>
<text x="417.6" y="203.5" class="lb ink2" text-anchor="start">training loss keeps falling,</text>
<text x="417.6" y="220.5" class="lb ink2" text-anchor="start">validation loss rises.</text>
