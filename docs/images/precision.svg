<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="title desc">
<title id="title">float32 vs float16 speed</title>
<desc id="desc">Two bar charts. Training throughput: float32 18.8k tokens/s, float16 5.1k. Matrix multiply TFLOP/s, float32 vs float16: QKV projection 1.51 vs 0.41; MLP up-projection 1.82 vs 0.41; Square 4096³ 1.81 vs 0.41.</desc>
<style>text{font-family:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}.t{font-size:16px;font-weight:600}.st{font-size:13px}.lb{font-size:12px}.pt{font-size:13px;font-weight:600}.bg{fill:#ffffff;stroke:rgba(11,11,11,0.10)}.ink{fill:#191919}.ink2{fill:#666666}.grid{stroke:#e7e7e7}.axis{stroke:#c2c2c2}.s1{stroke:#257de0}.s2{stroke:#f47230}.f1{fill:#257de0}.f2{fill:#f47230}.ring{stroke:#ffffff}@media (prefers-color-scheme: dark){.bg{fill:#191919;stroke:rgba(255,255,255,0.10)}.ink{fill:#efefef}.ink2{fill:#9c9c9c}.grid{stroke:#303030}.axis{stroke:#474747}.s1{stroke:#338ced}.s2{stroke:#e76624}.f1{fill:#338ced}.f2{fill:#e76624}.ring{stroke:#191919}}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="431" rx="8"/>
<text x="24.0" y="34.0" class="t ink" text-anchor="start">float32 vs float16 on a GPU without tensor cores (GTX 1650 Ti)</text>
<text x="24.0" y="56.0" class="st ink2" text-anchor="start">Higher is better. Measured on this machine; the same numbers are in the tables below.</text>
<rect x="24.0" y="72.0" width="12" height="12" rx="2" class="f1"/>
<text x="46.0" y="82.0" class="lb ink2" text-anchor="start">float32</text>
<rect x="116.4" y="72.0" width="12" height="12" rx="2" class="f2"/>
<text x="138.4" y="82.0" class="lb ink2" text-anchor="start">float16</text>
<text x="24.0" y="118.0" class="pt ink" text-anchor="start">Training throughput, thousand tokens/s: float32 is 3.7× faster</text>
<text x="188.0" y="155.0" class="lb ink" text-anchor="end">Full training step</text>
<line x1="200.0" y1="128.0" x2="200.0" y2="176.0" class="axis" stroke-width="1"/>
