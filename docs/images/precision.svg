<text x="318.2" y="165.0" class="lb ink" text-anchor="start">5.1</text>
<text x="24.0" y="232.0" class="pt ink" text-anchor="start">Matrix multiply, TFLOP/s: float16 is stuck near 0.41 (4.4× below float32)</text>
<text x="188.0" y="269.0" class="lb ink" text-anchor="end">QKV projection</text>
<text x="188.0" y="321.0" class="lb ink" text-anchor="end">MLP up-projection</text>
<text x="188.0" y="373.0" class="lb ink" text-anchor="end">Square 4096³</text>
