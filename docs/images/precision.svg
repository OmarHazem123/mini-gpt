<text x="310.0" y="192.0" class="lb ink2" text-anchor="middle">5</text>
<line x1="420.0" y1="128.0" x2="420.0" y2="176.0" class="grid" stroke-width="1"/>
<text x="420.0" y="192.0" class="lb ink2" text-anchor="middle">10</text>
<line x1="530.0" y1="128.0" x2="530.0" y2="176.0" class="grid" stroke-width="1"/>
<text x="530.0" y="192.0" class="lb ink2" text-anchor="middle">15</text>
<line x1="640.0" y1="128.0" x2="640.0" y2="176.0" class="grid" stroke-width="1"/>
<text x="640.0" y="192.0" class="lb ink2" text-anchor="middle">20</text>
<path d="M200.0,132.0 H609.6 A4.0,4.0 0 0 1 613.6,136.0 V146.0 A4.0,4.0 0 0 1 609.6,150.0 H200.0 Z" class="f1"/>
<text x="619.6" y="145.0" class="lb ink" text-anchor="start">18.8</text>
